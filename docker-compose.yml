services:
  ssh-565.cyrhades.fr:
    container_name: ssh-565
    build:
      context: ./.docker/ssh
      args:
        LANGUAGE: ${LANGUAGE:-fr}
    labels:
      ho.ctf.cyrhades: "challenge"
      ho.ctf.cyrhades.webssh: "1"
    environment:
      SSH_HOSTNAME: "ssh-565.cyrhades.fr"
      SSH_PORT: 22
      SSH_USERNAME: "cyrhades"
      SSH_PASSWORD: "secret"
    restart: unless-stopped
  small-primes-shellcode.cyrhades.fr:
    image: anssi/fcsc2025-pwn-small-primes-shellcode:latest
